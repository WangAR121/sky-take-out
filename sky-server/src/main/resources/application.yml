server:
  port: 8080

spring:
  profiles:
    active: dev
  main:
    allow-circular-references: true
  datasource:
    druid:
      driver-class-name: ${sky.datasource.driver-class-name}
      url: jdbc:mysql://${sky.datasource.host}:${sky.datasource.port}/${sky.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${sky.datasource.username}
      password: ${sky.datasource.password}
  redis:
    host: ${sky.redis.host}
    port: ${sky.redis.port}

mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.sky.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      sky:
        mapper: debug
        service: info
        controller: info

sky:
  jwt:
    # 设置jwt签名加密时使用的秘钥
    admin-secret-key: itcast
    # 设置jwt过期时间
    admin-ttl: 7200000
    # 设置前端传递过来的令牌名称
    admin-token-name: token
    user-secret-key: Wanganran1111
    user-ttl: 7200000
    user-token-name: authentication
  alioss:
    # 阿里云 OSS：本地开发的实际值写在 application-dev.yml；这里只是环境变量模板，未设置时为空，不会导致启动报错
    endpoint: ${OSS_ENDPOINT:}
    region: ${OSS_REGION:}
    bucketName: ${OSS_BUCKET_NAME:}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
  wechat:
    # 微信小程序参数：本地开发写在 application-dev.yml；这里用环境变量兜底。
    # 注意不要写成 ${sky.wechat.appid}，那是自引用，会被 Spring 判定为循环占位符
    appid: ${WX_APPID:}
    secret: ${WX_APP_SECRET:}
